<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Lighthouse.guide</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Netlify Forms detects these at build/deploy time (static HTML scan)
         — they must exist here, not just be POSTed to at runtime, for
         useSupportTickets.js / PractitionerProfile.jsx submissions to land
         in the Netlify dashboard. -->
    <form name="support-ticket" data-netlify="true" hidden>
      <input type="text" name="message" />
      <input type="text" name="contact" />
    </form>
    <form name="booking" data-netlify="true" hidden>
      <input type="text" name="bookingId" />
      <input type="text" name="practitioner" />
      <input type="text" name="session" />
      <input type="text" name="when" />
      <input type="text" name="name" />
      <input type="text" name="contact" />
    </form>
  </body>
</html>
